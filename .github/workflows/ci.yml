name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
      - name: Install dev deps
        run: |
          pip install -r Backend/requirements-dev.txt
      - name: Lint
        run: |
          black --check .
          isort --check-only .
          ruff Backend
      - name: Typecheck
        run: |
          mypy Backend/app
      - name: Tests
        run: |
          pytest -q
      - name: Extract WBCD EDA
        run: |
          python Backend/app/scripts/extract_wbcd_eda.py
      - name: Train WBCD
        run: |
          python Backend/app/scripts/run_train_wbcd.py
      - name: Evaluate WBCD
        run: |
          python Backend/app/scripts/run_evaluate_wbcd.py
      - name: Train Metabric
        run: |
          python Backend/app/scripts/run_train_metabric.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            Backend/app/models/*.joblib
            Backend/app/models/*.pkl
            Backend/app/data/*.json
            mlruns/
